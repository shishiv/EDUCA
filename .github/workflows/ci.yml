name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Type Check, Lint and Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

  e2e:
    name: Full E2E with local Supabase
    runs-on: ubuntu-latest
    # Receipt from run 30788770244: 851 tests on one worker consumed 126 minutes before cancellation.
    # The selected CI projects below remove 46 repeated non-admin role cases; the expected receipt is 805 tests.
    # Successful cases averaged about 1.5s, so 30 minutes leaves headroom above the projected 21-minute suite.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    env:
      # The pilot E2E runner already uses production mode, which avoids the Next.js dev overlay.
      PLAYWRIGHT_SERVER_COMMAND: pnpm build && pnpm start

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium for CI
        run: pnpm exec playwright install --with-deps chromium

      - name: Start disposable local Supabase
        shell: bash
        run: |
          set -euo pipefail
          log_file="${RUNNER_TEMP}/supabase-start.log"
          if pnpm exec supabase --workdir .. start >"$log_file" 2>&1; then
            exit 0
          fi
          grep -iE 'error|failed|already allocated|health|try' "$log_file" || true
          exit 1

      - name: Reset local database with canonical migrations only
        run: pnpm exec supabase --workdir .. db reset --local --no-seed

      - name: Export local Supabase environment
        shell: bash
        run: |
          set -euo pipefail

          status_env="$(pnpm exec supabase --workdir .. status -o env)"

          status_value() {
            printf '%s\n' "$status_env" \
              | awk -F= -v name="$1" '$1 == name { sub(/^[^=]*=/, ""); print; exit }' \
              | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//"
          }

          api_url="$(status_value API_URL)"
          publishable_key="$(status_value PUBLISHABLE_KEY)"
          secret_key="$(status_value SECRET_KEY)"
          legacy_anon_key="$(status_value ANON_KEY)"
          legacy_service_key="$(status_value SERVICE_ROLE_KEY)"
          anon_key="${publishable_key:-$legacy_anon_key}"
          service_key="${secret_key:-$legacy_service_key}"

          test -n "$api_url"
          test -n "$anon_key"
          test -n "$service_key"

          echo "::add-mask::$anon_key"
          echo "::add-mask::$service_key"

          {
            printf 'NEXT_PUBLIC_SUPABASE_URL=%s\n' "$api_url"
            printf 'NEXT_PUBLIC_SUPABASE_ANON_KEY=%s\n' "$anon_key"
            printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$service_key"
            printf 'NEXT_PUBLIC_APP_URL=http://127.0.0.1:3000\n'
            printf 'PLAYWRIGHT_BASE_URL=http://localhost:3000\n'
          } >> "$GITHUB_ENV"

      - name: Reject remote E2E configuration
        shell: bash
        run: |
          set -euo pipefail

          for variable in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF SUPABASE_DEMO_URL SUPABASE_DEMO_SERVICE_KEY SUPABASE_DEMO_DB_URL; do
            if [[ -n "${!variable:-}" ]]; then
              echo "E2E safety gate rejected unexpected remote variable: $variable" >&2
              exit 1
            fi
          done

          case "$NEXT_PUBLIC_SUPABASE_URL" in
            http://127.0.0.1:54321|http://localhost:54321) ;;
            *)
              echo 'E2E safety gate requires a loopback Supabase URL' >&2
              exit 1
              ;;
          esac

          for variable in PLAYWRIGHT_BASE_URL NEXT_PUBLIC_APP_URL; do
            case "${!variable}" in
              http://127.0.0.1:3000|http://localhost:3000) ;;
              *)
                echo "E2E safety gate requires a loopback application URL: $variable" >&2
                exit 1
                ;;
            esac
          done

          for variable in NEXT_PUBLIC_SUPABASE_URL PLAYWRIGHT_BASE_URL NEXT_PUBLIC_APP_URL; do
            value="${!variable:-}"
            case "$value" in
              *educa-demo.vercel.app*|*supabase.co*|*supabase.in*)
                echo "E2E safety gate rejected remote host in: $variable" >&2
                exit 1
                ;;
            esac
          done

          case "$NEXT_PUBLIC_SUPABASE_ANON_KEY" in
            sb_publishable_*) ;;
            *)
              echo 'E2E safety gate requires the local publishable key' >&2
              exit 1
              ;;
          esac

          case "$SUPABASE_SERVICE_ROLE_KEY" in
            sb_secret_*) ;;
            *)
              echo 'E2E safety gate requires the local secret key' >&2
              exit 1
              ;;
          esac

      - name: Record E2E selection receipt
        shell: bash
        run: |
          set -euo pipefail

          if ! receipt="$(pnpm exec playwright test --list --project=setup --project=chromium-unauth --project=chromium 2>&1)"; then
            printf '%s\n' "$receipt" | tail -n 40
            echo 'E2E selection receipt failed' >&2
            exit 1
          fi

          test_count="$(printf '%s\n' "$receipt" | grep -Eo 'Total: [0-9]+ tests?' | awk '{print $2}' | tail -n 1 || true)"
          if [[ ! "$test_count" =~ ^[0-9]+$ ]]; then
            printf '%s\n' "$receipt" | tail -n 40
            echo 'E2E selection receipt did not contain a test count' >&2
            exit 1
          fi

          # Current receipt is 805 tests; 15 cases of maintenance headroom remain before failing visibly.
          max_tests=820
          echo "E2E selection receipt: projects=setup,chromium-unauth,chromium tests=$test_count max=$max_tests"
          if (( test_count > max_tests )); then
            echo "E2E selection tripwire exceeded: $test_count tests selected, maximum is $max_tests" >&2
            exit 1
          fi

      - name: Seed canonical E2E fixtures
        run: pnpm seed:e2e

      - name: Export seeded E2E school selection
        shell: bash
        run: |
          set -euo pipefail
          response_file="${RUNNER_TEMP}/e2e-schools.json"
          curl -fsS -o "$response_file" \
            "$NEXT_PUBLIC_SUPABASE_URL/rest/v1/escolas?select=id&ativo=eq.true&order=nome.asc&limit=1" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY"
          school_id="$(node -e 'const fs = require("node:fs"); const rows = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (!rows[0]?.id) process.exit(1); process.stdout.write(rows[0].id)' "$response_file")"
          if [[ ! "$school_id" =~ ^[0-9a-f-]{36}$ ]]; then
            echo 'E2E school selection fixture did not return a UUID' >&2
            exit 1
          fi
          printf 'E2E_SELECTED_SCHOOL_ID=%s\n' "$school_id" >> "$GITHUB_ENV"

      - name: Run full E2E suite
        run: pnpm exec playwright test --project=setup --project=chromium-unauth --project=chromium --max-failures=1

      # Do not upload playwright/.auth or trace archives: they can contain session material.
      - name: Upload E2E diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: educa-e2e-diagnostics
          if-no-files-found: ignore
          path: |
            app/playwright-report/**
            !app/playwright-report/**/*.zip
            app/test-results/**/*.png
            !app/test-results/**/*.zip

      - name: Stop local Supabase and delete volumes
        if: ${{ always() }}
        run: pnpm exec supabase --workdir .. stop --no-backup
